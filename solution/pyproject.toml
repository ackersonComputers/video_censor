[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "censor"
version = "1.0.0"
description = "Subtitle-anchored profanity muting and scene editing for video files"
requires-python = ">=3.10"
dependencies = [
    "pysubs2>=1.6",
    "rapidfuzz>=3.6",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Install torch separately with the right CUDA wheel index, e.g.
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu124
asr = ["whisperx>=3.1", "faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
censor = "censor.cli:main"

[tool.setuptools.packages.find]
include = ["censor*"]

[tool.setuptools.package-data]
censor = ["wordlists/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
