# Relaxed profanity word list for `censor`.
#
# This version focuses on:
#   - "fuck" and common spelling variants/inflections
#   - religious profanity
#   - "cunt" and its inflections
#   - explicit sexual slang, acts and references
#
# Medically neutral anatomy terms such as "penis", "vagina", "breast",
# "nipple" and "clitoris" are intentionally allowed. Slurs are also not
# included in this version.
#
# Structure:
#   tiers:
#     <tier-name>:
#       exact:     tokens matched only as a whole normalized word
#       substring: tokens matched if they appear anywhere inside a word
#       phrases:   multi-word sequences; matched greedily longest-first.
#                  Whitespace and hyphens between words are interchangeable.
#
# `exclusions` are normalized words that are NEVER censored, even if a
# substring rule would otherwise match them.

