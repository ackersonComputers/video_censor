# Profanity word list for `censor`.
#
# Structure:
#   tiers:
#     <tier-name>:
#       exact:     tokens matched only as a whole normalized word
#       substring: tokens matched if they appear anywhere inside a word
#                  (catches inflections: "fuck" -> "fuckity", "unfuckingbelievable")
#       phrases:   multi-word sequences; matched greedily longest-first.
#                  Whitespace and hyphens between words are interchangeable.
#
# `exclusions` are normalized words that are NEVER censored, even if a
# substring rule would otherwise match them. This is how "christian" and
# "scunthorpe" survive.
#
# Normalization before matching: lowercase, curly quotes -> straight,
# strip all characters except a-z, 0-9 and ' (so "hard-on" -> "hardon",
# "f**k" -> "fk" which will NOT match; use `regex_extra` for masked forms).

